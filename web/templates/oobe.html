<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onekey - 首次使用向导</title>

    <!-- Material Design 3 -->
    <link
      href="https://cdn.jsdmirror.com/gh/ikun0014/font@main/style.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body>
    <div class="oobe-container">
      <!-- 顶部应用栏 -->
      <div class="oobe-card">
        <div class="oobe-header">
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            title="切换主题"
          >
            <span class="material-icons">light_mode</span>
          </button>
          <div class="oobe-logo">
            <span class="material-icons" style="font-size: inherit"
              >extension</span
            >
          </div>
          <h1 class="oobe-title">欢迎使用 Onekey</h1>
          <p class="oobe-subtitle">一键解锁，畅享游戏体验</p>
        </div>

        <div class="oobe-content">
          <div class="step-indicator">
            <div class="step-dot active" data-step="0"></div>
            <div class="step-dot" data-step="1"></div>
          </div>

          <!-- 步骤 1: 欢迎 -->
          <div class="oobe-step active" data-step="0">
            <div class="welcome-text">
              <h3>🎮 欢迎来到 Onekey 世界</h3>
              <p>
                Onekey 是一个强大的 Steam
                游戏解锁工具，帮助您轻松管理和解锁游戏。
              </p>
              <p>现在您可以开始使用所有功能了。</p>
              <p><strong>特点：</strong></p>
              <p>• 支持 SteamTools 和 GreenLuma 两种解锁方式</p>
              <p>• 直观的 Web 界面，操作简单</p>
              <p>• 实时日志显示，过程透明</p>
              <p>• 前端代码完全开源, 绝对不盗号/挖矿</p>
            </div>
          </div>

          <!-- 步骤 2: 完成 -->
          <div class="oobe-step" data-step="1">
            <div class="welcome-text">
              <h3>🎉 设置完成</h3>
              <p>恭喜！您已成功激活 Onekey 工具。</p>
              <p>现在您可以开始使用所有功能了。</p>
              <div class="key-info" style="margin-top: 24px">
                <div class="key-info-item">
                  <span class="material-icons">verified_user</span>
                  <span><strong>卡密状态：</strong>永久有效</span>
                </div>
                <div class="key-info-item">
                  <span class="material-icons">event</span>
                  <span><strong>有效期至：</strong>永久</span>
                </div>
              </div>
            </div>
          </div>

          <div class="oobe-actions">
            <button
              type="button"
              id="prevBtn"
              class="btn btn-text"
              style="display: none"
            >
              <span class="material-icons">arrow_back</span>
              上一步
            </button>
            <button
              type="button"
              id="nextBtn"
              class="btn btn-primary btn-large"
            >
              <span class="material-icons">arrow_forward</span>
              下一步
            </button>
            <button
              type="button"
              id="finishBtn"
              class="btn btn-primary btn-large"
              style="display: none"
            >
              <span class="material-icons">check</span>
              开始使用
            </button>
          </div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <!-- 提示框 -->
    <div id="snackbar" class="snackbar">
      <div class="snackbar-content">
        <span id="snackbarMessage"></span>
        <button id="snackbarClose" class="snackbar-action">
          <span class="material-icons">close</span>
        </button>
      </div>
    </div>

    <script>
      class OOBEManager {
        constructor() {
          this.currentStep = 0;
          this.totalSteps = 2; // 只有欢迎和完成两个步骤

          this.initializeEventListeners();
          this.updateStepDisplay();
        }

        initializeEventListeners() {
          document.getElementById("nextBtn").addEventListener("click", () => {
            this.nextStep();
          });

          document.getElementById("prevBtn").addEventListener("click", () => {
            this.prevStep();
          });

          document.getElementById("finishBtn").addEventListener("click", () => {
            this.finishSetup();
          });

          document
            .getElementById("snackbarClose")
            .addEventListener("click", () => {
              this.hideSnackbar();
            });
        }

        nextStep() {
          if (this.currentStep < this.totalSteps - 1) {
            this.currentStep++;
            this.updateStepDisplay();
          }
        }

        prevStep() {
          if (this.currentStep > 0) {
            this.currentStep--;
            this.updateStepDisplay();
          }
        }

        updateStepDisplay() {
          document.querySelectorAll(".step-dot").forEach((dot, index) => {
            dot.classList.remove("active", "completed");
            if (index < this.currentStep) {
              dot.classList.add("completed");
            } else if (index === this.currentStep) {
              dot.classList.add("active");
            }
          });

          document.querySelectorAll(".oobe-step").forEach((step, index) => {
            step.classList.toggle("active", index === this.currentStep);
          });

          this.updateButtons();
        }

        updateButtons() {
          const prevBtn = document.getElementById("prevBtn");
          const nextBtn = document.getElementById("nextBtn");
          const finishBtn = document.getElementById("finishBtn");

          [prevBtn, nextBtn, finishBtn].forEach((btn) => {
            btn.style.display = "none";
          });

          if (this.currentStep > 0) {
            prevBtn.style.display = "flex";
          }

          if (this.currentStep < this.totalSteps - 1) {
            nextBtn.style.display = "flex";
          } else {
            finishBtn.style.display = "flex";
          }
        }

        async finishSetup() {
          this.showLoading(true);

          try {
            // 保存默认配置（不需要卡密）
            const response = await fetch("/api/config/update", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                key: "permanent_key",
                steam_path: "",
                debug_mode: false,
                logging_files: true,
                show_console: false,
              }),
            });

            const data = await response.json();

            if (data.success) {
              this.showSnackbar("配置保存成功，正在跳转...", "success");
              setTimeout(() => {
                window.location.href = "/";
              }, 1500);
            } else {
              throw new Error(data.message || "保存配置失败");
            }
          } catch (error) {
            this.showSnackbar("保存配置失败：" + error.message, "error");
            console.error("Save config error:", error);
          } finally {
            this.showLoading(false);
          }
        }

        showLoading(show) {
          const overlay = document.getElementById("loadingOverlay");
          overlay.classList.toggle("show", show);
        }

        showSnackbar(message, type = "info") {
          const snackbar = document.getElementById("snackbar");
          const snackbarMessage = document.getElementById("snackbarMessage");

          snackbarMessage.textContent = message;
          snackbar.className = `snackbar ${type} show`;

          setTimeout(() => {
            this.hideSnackbar();
          }, 4000);
        }

        hideSnackbar() {
          const snackbar = document.getElementById("snackbar");
          snackbar.classList.remove("show");
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        new OOBEManager();
      });
    </script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
  </body>
</html>
